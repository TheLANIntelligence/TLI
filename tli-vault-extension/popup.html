<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TLI Vault</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <span class="logo">TLI</span>
    <span class="title">Vault Autofill</span>
    <a href="#" id="settings-link" title="Settings">&#9881;</a>
  </div>

  <div id="status-bar" class="status-bar"></div>

  <div class="search-row">
    <svg class="search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="search" id="search-input" placeholder="Search logins…" autocomplete="off" spellcheck="false">
  </div>

  <div id="login-list" class="login-list">
    <div class="empty-state" id="empty-msg">Loading logins…</div>
  </div>

  <div class="footer">
    <button id="autofill-btn" class="btn-primary">Autofill Current Page</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
