<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TLI</title>
  <style>
    :root{
      --bg:#0b0f14;
      --panel:#121823;
      --border:rgba(255,255,255,.10);
      --text:#e6e9ef;
      --muted:#a6adbb;
      --accent:#38e8b2;
      --accent-rgb:56,232,178;
    }
    html,body{
      width:100%;
      height:100%;
      margin:0;
      background:transparent;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    }
    .wrap{
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      background: radial-gradient(1000px 380px at 50% 25%, rgba(var(--accent-rgb),0.10), transparent 60%),
                  linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.10)),
                  var(--bg);
      border:1px solid var(--border);
      border-radius:18px;
      box-sizing:border-box;
      overflow:hidden;
    }
    .card{
      width: 420px;
      padding: 22px 22px 18px 22px;
      border-radius:16px;
      background: rgba(18,24,35,0.78);
      border:1px solid rgba(255,255,255,0.10);
      box-shadow: 0 20px 70px rgba(0,0,0,0.55);
      position:relative;
    }
    .logo{
      width:52px;
      height:52px;
      border-radius:14px;
      background: rgba(var(--accent-rgb),0.12);
      border:1px solid rgba(var(--accent-rgb),0.45);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 0 28px rgba(var(--accent-rgb),0.30);
      display:flex;
      align-items:center;
      justify-content:center;
      margin-bottom:14px;
    }
    .logo span{
      font-weight:700;
      letter-spacing:0.06em;
      color: rgba(var(--accent-rgb),0.95);
    }
    .title{
      font-size:18px;
      font-weight:650;
      color: var(--text);
      margin:0 0 6px 0;
    }
    .line{
      font-size:13px;
      color: var(--muted);
      margin: 0 0 4px 0;
    }
    .spinnerRow{
      display:flex;
      align-items:center;
      gap:10px;
      margin-top:14px;
      padding-top:12px;
      border-top:1px solid rgba(255,255,255,0.08);
    }
    .spinner{
      width:14px;
      height:14px;
      border-radius:50%;
      border:2px solid rgba(255,255,255,0.18);
      border-top-color: rgba(var(--accent-rgb),0.95);
      animation: spin 0.9s linear infinite;
    }
    .status{
      font-size:12px;
      color: rgba(255,255,255,0.70);
    }
    @keyframes spin{
      to{ transform: rotate(360deg); }
    }
    .glowline{
      position:absolute;
      inset:auto -40px -40px -40px;
      height:120px;
      background: radial-gradient(closest-side, rgba(var(--accent-rgb),0.18), transparent 70%);
      filter: blur(8px);
      pointer-events:none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="glowline"></div>

      <div class="logo"><span>TLI</span></div>

      <div class="title">TheLegatoIntelligence</div>
      <p class="line">Initializing local-first system</p>
      <p class="line">No cloud. No tracking.</p>

      <div class="spinnerRow">
        <div class="spinner"></div>
        <div class="status">Starting local services…</div>
      </div>
    </div>
  </div>
</body>
</html>
