name: Source checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and developer tools (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      TLI_OPEN_BROWSER: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-test.txt
      - name: Check source hygiene
        run: python scripts/check_source_hygiene.py
      - name: Test isolated backend
        run: python -m pytest backend/tests -q --tb=short -o faulthandler_timeout=120
      - name: Test developer tools
        run: python -m pytest scripts/tests -q --tb=short

  frontend:
    name: Desktop browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node --test --test-concurrency=4 frontend/tests/*.test.cjs
      - name: Update feed compatibility
        run: node --test scripts/tests/update-feed.test.mjs

  companion:
    name: Companion TypeScript and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Reject critical dependency advisories
        run: npm audit --audit-level=critical
      - run: npm run check
